version: '3.8'

services:
  # 1. Apache Kafka (Mode KRaft - Pas de Zookeeper)
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092" # Port pour Node-RED et UI (Interne Docker)
      - "9094:9094" # Port pour votre machine hôte (Externe)
    environment:
      # Rôle : Ce nœud agit comme Broker et Contrôleur (KRaft)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      
      # Configuration des Listeners (Écouteurs)
      # CONTROLLER : Communication interne pour le consensus KRaft
      # INTERNAL : Communication interne Docker (pour Node-RED et Kafka-UI)
      # EXTERNAL : Communication depuis votre PC (localhost)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - sbems-net

  # 2. Node-RED (IoT Simulator)
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - ./node_red_data:/data
    depends_on:
      - kafka
    networks:
      - sbems-net

  # 3. Kafka UI (Visualisation - Kafbat)
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8888:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: SBEMS-Cluster
      # Ici on utilise le nom du service "kafka" et le port interne 9092
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - sbems-net

networks:
  sbems-net:
    driver: bridge